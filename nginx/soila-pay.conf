# Plain nginx site for a server running Soila-Pay without Docker.
# Install: copy to /etc/nginx/sites-available/soila-pay, symlink into
# sites-enabled, set server_name, then `nginx -t && systemctl reload nginx`.
# Add HTTPS with: certbot --nginx -d your.domain
server {
    listen 80;
    server_name pay.soila.rw;

    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # FastAPI backend (deploy/soila-pay-api.service)
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:8000/api/v1/;
        proxy_read_timeout 300s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
    }

    # Next.js frontend (deploy/soila-pay-web.service)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
